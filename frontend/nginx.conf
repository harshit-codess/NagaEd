server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Upstreams are resolved by Docker service name (never localhost).
  # Most specific location first: the AI service owns this one route.
  location = /api/suggest-username {
    proxy_pass http://ai-service:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Swagger UI / OpenAPI of the FastAPI service
  location ~ ^/(docs|redoc|openapi\.json)$ {
    proxy_pass http://ai-service:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Everything else under /api goes to the Node.js API
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
